spring.application.name=demo
server.port=8080

logging.level.com.udla.arquitectura.demo=INFO

# --- Cache (Caffeine): maximo 100 entradas, cada una expira a los 60 s ---
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=60s

# --- CORS (solo desarrollo): origenes del frontend que pueden llamar a la API ---
# 5500/8000 -> servidor estatico simple, 5173 -> Vite, 3000 -> React/Next
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://localhost:5173,http://localhost:3000
